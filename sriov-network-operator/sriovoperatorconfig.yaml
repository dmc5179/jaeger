# NOTE: when the RDMA / nvidia-network-operator app is enabled, this resource
# also needs the configDaemonNodeSelector patch in
# optional-apps/nvidia-network-operator/README.md.
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovOperatorConfig
metadata:
  name: default
  namespace: openshift-sriov-network-operator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "25"
spec:
  enableInjector: true
  enableOperatorWebhook: true
  logLevel: 2
