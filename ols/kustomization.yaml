apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-lightspeed

resources:
  - credentials-secret.yaml
  - olsconfig.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: openshift-lightspeed
    includeSelectors: false

# application.yaml is deliberately not a resource here: it is the Argo
# Application that points at this directory, applied out-of-band to
# openshift-gitops.
